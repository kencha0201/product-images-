<title>スキマTOEIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#f4f6f8; --card:#ffffff; --ink:#1f2a37; --muted:#5c6b7a;
    --line:#dde3e9; --accent:#23617a; --accent-ink:#ffffff; --accent-soft:#e3eef3;
    --amber:#b97c24; --amber-soft:#f6ecda;
    --good:#2e7d4f; --good-soft:#e0f0e7; --no:#a04545; --no-soft:#f5e3e3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0f151c; --card:#18212b; --ink:#e4eaf0; --muted:#93a2b1;
      --line:#2b3642; --accent:#4f9cc0; --accent-ink:#08222e; --accent-soft:#1c2f3a;
      --amber:#d9a24e; --amber-soft:#33291a;
      --good:#6cbf8f; --good-soft:#1c2f24; --no:#cf8080; --no-soft:#33211f;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0f151c; --card:#18212b; --ink:#e4eaf0; --muted:#93a2b1;
    --line:#2b3642; --accent:#4f9cc0; --accent-ink:#08222e; --accent-soft:#1c2f3a;
    --amber:#d9a24e; --amber-soft:#33291a;
    --good:#6cbf8f; --good-soft:#1c2f24; --no:#cf8080; --no-soft:#33211f;
  }
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    line-height:1.7;font-feature-settings:"palt";
    padding-bottom:env(safe-area-inset-bottom);
  }
  #wrap{max-width:440px;margin:0 auto;padding:0 16px 48px}
  header{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:14px 2px 10px;position:sticky;top:0;background:var(--paper);z-index:2;
  }
  .brand{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:1.15rem;color:var(--accent)}
  .exam{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .exam b{color:var(--amber);font-size:1rem}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
  .row{display:flex;gap:12px;align-items:center;justify-content:space-between}
  .streak{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:1.05rem}
  .streak b{font-size:1.6rem;font-variant-numeric:tabular-nums}
  .dots{display:flex;gap:6px}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--good)}
  .dotlbl{font-size:.72rem;color:var(--muted);text-align:right}
  .btn{
    display:block;width:100%;border:none;border-radius:14px;cursor:pointer;
    font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:1.05rem;
    padding:16px;margin:10px 0;background:var(--accent);color:var(--accent-ink);
  }
  .btn.sub{background:var(--accent-soft);color:var(--accent);font-size:.92rem;padding:13px}
  .btn:active{transform:scale(.98)}
  .btnrow{display:flex;gap:10px}
  .btnrow .btn{margin:0}
  .statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
  .stat .num{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
  .stat .lbl{font-size:.7rem;color:var(--muted)}
  .lvrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.78rem}
  .lvrow .tag{width:64px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .lvrow .n{width:64px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .duechip{display:inline-block;background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:700}
  h3{font-family:"Zen Kaku Gothic New",sans-serif;font-size:.95rem;margin:0 0 8px}
  .prog{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin:10px 2px;font-variant-numeric:tabular-nums}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:center}
  .qword{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:1.9rem;line-height:1.3;overflow-wrap:break-word}
  .qphrase{font-size:1.02rem;margin-top:6px;color:var(--muted)}
  .qphrase b{color:var(--accent)}
  .qsent{font-size:1.05rem;line-height:1.9;text-align:left}
  .qsent b{color:var(--amber);letter-spacing:.05em}
  .ask{font-size:.78rem;color:var(--muted);margin-top:10px}
  .choice{
    display:block;width:100%;text-align:left;cursor:pointer;
    background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;
    font-family:inherit;font-size:.98rem;padding:13px 15px;margin:8px 0;
  }
  .choice:active{background:var(--accent-soft)}
  .choice.ok{border-color:var(--good);background:var(--good-soft);font-weight:700}
  .choice.ng{border-color:var(--no);background:var(--no-soft)}
  .choice[disabled]{cursor:default;opacity:.92}
  .fb{margin-top:12px;font-size:.9rem}
  .fb .mark{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:1.15rem}
  .fb .mark.good{color:var(--good)} .fb .mark.bad{color:var(--no)}
  .fb .exp{color:var(--muted);text-align:left;background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:8px}
  .spk{background:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.85rem;cursor:pointer;color:var(--ink)}
  .bignum{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:3rem;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums}
  .msg{text-align:center;font-weight:700;margin:4px 0 12px}
  .mile{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.9rem;text-align:center;margin:8px 0}
  details{font-size:.82rem;color:var(--muted);margin:16px 4px}
  details summary{cursor:pointer;font-weight:700}
  .foot{font-size:.72rem;color:var(--muted);text-align:center;margin-top:20px}
  .sndbtn{background:var(--card);border:1.5px solid var(--line);border-radius:999px;width:36px;height:36px;font-size:1.05rem;cursor:pointer;line-height:1;padding:0}
  .hright{display:flex;align-items:center;gap:10px}
  .fx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:9}
  .fx span{font-size:5.5rem;opacity:0;animation:fxpop .7s ease-out forwards}
  @keyframes fxpop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.15)}55%{transform:scale(1)}100%{opacity:0;transform:scale(1)}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .pop{animation:pop .35s}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
  .fbrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .toastmsg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.85rem;z-index:10;max-width:90%;text-align:center}
  .gchip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 12px;font-size:.75rem;font-weight:700;margin-bottom:8px}
  .bkta{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:.75rem;padding:10px;word-break:break-all;font-family:ui-monospace,monospace;box-sizing:border-box}
  @media (prefers-reduced-motion: reduce){
    .btn:active{transform:none}
    .fx span,.shake,.pop{animation:none}
    .fx span{opacity:0}
  }
</style>
<div id="wrap">
  <header>
    <div class="brand">スキマTOEIC</div>
    <div class="hright">
      <div class="exam">1月本番(目安)まで <b id="dleft">--</b> 日</div>
      <button class="sndbtn" id="sndbtn" onclick="toggleSnd()" title="音のオン/オフ">🔊</button>
    </div>
  </header>
  <main id="view"></main>
</div>

function todayStr(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayNum(){ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5); }
function normalize(){
  const t=todayStr();
  if(S.day!==t){
    S.day=t; S.done=0;
    const y=todayStr(new Date(Date.now()-864e5));
    if(S.last && S.last!==t && S.last!==y) S.streak=0;
  }
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function rescape(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function hlPhrase(it){
  const re=new RegExp("("+rescape(it.w)+"\\w*)","i");
  const p=esc(it.p);

}

let AC=null;
function tone(seq){
  if(!S.snd) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const t0=AC.currentTime;
    seq.forEach(n=>{
      const [f,st,d,type,vol]=n;
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type||"sine"; o.frequency.value=f;
      g.gain.setValueAtTime(vol||0.16,t0+st);
      g.gain.exponentialRampToValueAtTime(0.001,t0+st+d);
      o.connect(g).connect(AC.destination);
      o.start(t0+st); o.stop(t0+st+d);
    });
  }catch(e){}
}

let ses=null;
function pickWords(n,opt){
  if(opt==="rand") return shuffle(WORDS.slice()).slice(0,n);
  const t=dayNum(), lv=opt?Number(opt):0;
  const inLv=x=>!lv||x.lv===lv;
  const due=Object.keys(S.c).filter(w=>byWord[w]&&S.c[w].d<=t&&inLv(byWord[w]))
    .sort((a,b)=>S.c[a].d-S.c[b].d||S.c[a].b-S.c[b].b).slice(0,n);
  const q=due.slice();
  if(q.length<n){
    const fresh=shuffle(WORDS.filter(x=>!S.c[x.w]&&inLv(x)).map(x=>x.w));
    for(const w of fresh){ q.push(w); if(q.length>=n) break; }
  }
  if(q.length<n){
    const rest=shuffle(Object.keys(S.c).filter(w=>byWord[w]&&!q.includes(w)&&inLv(byWord[w])))
      .sort((a,b)=>S.c[a].b-S.c[b].b);
    q.push(...rest.slice(0,n-q.length));
  }
  return shuffle(q.map(w=>byWord[w]));
}
const GTAGS=[["品詞",0,7],["動詞の形",8,13],["前置詞",14,18],["接続詞",19,23],["代名詞・関係詞",24,28],["比較・その他",29,31],["語彙・定型表現",32,35]];
function gtag(i){ for(const [t,a,b] of GTAGS) if(i>=a&&i<=b) return t; return "その他"; }
function pickGrammar(n,genre){
  let idx=GRAMMAR.map((_,i)=>i);
  if(genre) idx=idx.filter(i=>gtag(i)===genre);
  shuffle(idx); idx.sort((a,b)=>(S.gs[a]||0)-(S.gs[b]||0));
  return idx.slice(0,n).map(i=>({q:GRAMMAR[i],gi:i}));
}
function choicesFor(it){
  const same=WORDS.filter(x=>x.w!==it.w&&x.lv===it.lv&&x.m!==it.m);
  const other=WORDS.filter(x=>x.w!==it.w&&x.lv!==it.lv&&x.m!==it.m);
  const pool=shuffle(same).concat(shuffle(other));
  const picks=[], seen=new Set([it.m]);
  for(const x of pool){ if(!seen.has(x.m)){ picks.push(x.m); seen.add(x.m); } if(picks.length>=3) break; }
  return shuffle([it.m,...picks]);
}
function startSession(mode,genre){
  const steps=[];
  if(mode==="mix"){ pickWords(10).forEach(x=>steps.push({t:"w",x})); pickGrammar(3).forEach(g=>steps.push({t:"g",...g})); }
  else if(mode==="word"){ pickWords(12,genre).forEach(x=>steps.push({t:"w",x})); }
  else { pickGrammar(6,genre).forEach(g=>steps.push({t:"g",...g})); }
  if(!steps.length){ return; }
  ses={steps,i:0,total:steps.length,correct:0,mode,genre:genre||""};
  renderStep();
}

  view.innerHTML+=
    miles.map(m=>'<div class="mile">'+m+"</div>").join("")+
    (S.sess%7===0?'<div class="mile" style="background:var(--accent-soft);color:var(--accent)">💾 ホームの「バックアップ」からコードを保存しておくと、データが消えても復元できます</div>':"")+
    '<button class="btn" onclick="startSession(\''+ses.mode+'\',\''+ses.genre+'\')">もう1セット'+(glabel?"("+glabel+")":"")+'</button>'+
    (ses.genre?'<button class="btn sub" onclick="'+(ses.mode==="word"?"wordMenu()":"gramMenu()")+'">モード選択へ</button>':"")+
    '<button class="btn sub" onclick="home()">ホームへ</button>';
  window.scrollTo(0,0);
}
home();
</script>
